name: Format strengthened tests

on:
  push:
    branches: [ci-fix]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Format strengthened tests
        run: npx --yes prettier@3.8.3 --write __tests__/src/ui/navigation.test.js __tests__/src/ui/pages/exercises.test.js __tests__/src/ui/pages/test.test.js __tests__/src/ui/pages/tenses.test.js

      - name: Commit formatted tests
        run: |
          if git diff --quiet -- __tests__/src/ui/navigation.test.js __tests__/src/ui/pages/exercises.test.js __tests__/src/ui/pages/test.test.js __tests__/src/ui/pages/tenses.test.js; then
            echo "Tests already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __tests__/src/ui/navigation.test.js __tests__/src/ui/pages/exercises.test.js __tests__/src/ui/pages/test.test.js __tests__/src/ui/pages/tenses.test.js
          git commit -m "style: format strengthened tests"
          git push
