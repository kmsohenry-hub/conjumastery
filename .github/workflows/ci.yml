name: CI

on:
  # La stabilisation reçoit le même signal CI que main avant promotion.
  push:
    branches: [main, stabilization, ci-fix]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    name: Lint, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Bootstrap repository formatting (ci-fix only)
        if: github.ref == 'refs/heads/ci-fix'
        run: |
          npx prettier@3.8.3 --write "**/*.{js,css,json,md}"
          if git diff --quiet; then
            echo "Formatting already clean."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.js' '*.css' '*.json' '*.md'
            git commit -m "ci: apply Prettier formatting"
            git push origin HEAD:ci-fix
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: npm test > unit-test.log 2>&1

      - name: Upload unit test log (ci-fix diagnostics)
        if: always() && github.ref == 'refs/heads/ci-fix'
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-log
          path: unit-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if unit tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

      - name: Run coverage (blocking quality gate)
        run: npm run test:coverage

      - name: Build (smoke test)
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
