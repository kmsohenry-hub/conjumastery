name: CI

on:
  push:
    branches: [main, stabilization, ci-fix]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    name: Lint, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Bootstrap repository formatting (ci-fix only)
        if: github.ref == 'refs/heads/ci-fix'
        run: |
          npx prettier@3.8.3 --write "**/*.{js,css,json,md}"
          git diff --name-only > formatting-changed.txt

      - name: Export formatted files (ci-fix only)
        if: github.ref == 'refs/heads/ci-fix'
        run: |
          if [ -s formatting-changed.txt ]; then
            tar -czf formatted-files.tar.gz -T formatting-changed.txt
          else
            tar -czf formatted-files.tar.gz --files-from /dev/null
          fi

      - name: Upload formatter output (ci-fix diagnostics)
        if: always() && github.ref == 'refs/heads/ci-fix'
        uses: actions/upload-artifact@v6
        with:
          name: formatted-files
          path: |
            formatted-files.tar.gz
            formatting-changed.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: npm test > unit-test.log 2>&1

      - name: Upload unit test log (ci-fix diagnostics)
        if: always() && github.ref == 'refs/heads/ci-fix'
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-log
          path: unit-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if unit tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

      - name: Run coverage (blocking quality gate)
        run: npm run test:coverage

      - name: Build (smoke test)
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
